name: Validate Links

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['README.md', 'SYNC.md', 'package.json', 'scripts/sync-all.js', 'scripts/test-sync-runner.js', '.github/workflows/validate.yml']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test sync runner offline
        run: node scripts/test-sync-runner.js

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/mlc_config.json'

